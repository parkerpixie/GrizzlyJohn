name: Wire V3 Body and Mind

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - scripts/wire-v3-body-mind.mjs

permissions:
  contents: write

jobs:
  wire-body-mind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
          fetch-depth: 0
      - name: Wire Body and Mind into Health
        run: node scripts/wire-v3-body-mind.mjs
      - name: Commit generated wiring
        run: |
          if git diff --quiet -- index.html service-worker.js; then
            echo "V3 Body and Mind wiring is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Wire V3 Body and Mind observations"
          git push origin HEAD:v3/health-foundation