name: Wire V3 Health Trends

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - .github/workflows/v3-health-trends-wire.yml

permissions:
  contents: write

jobs:
  wire-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
      - name: Wire Health trends
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) {
              if (source.includes(to)) return source;
              throw new Error(`Could not find ${label}; refusing to rewrite.`);
            }
            return source.replace(from, to);
          }

          let html = fs.readFileSync('index.html', 'utf8');
          html = replaceRequired(
            html,
            '  <link rel="stylesheet" href="health-v3-history.css">\n  <link rel="stylesheet" href="health-v3-body-mind.css">',
            '  <link rel="stylesheet" href="health-v3-history.css">\n  <link rel="stylesheet" href="health-v3-trends.css">\n  <link rel="stylesheet" href="health-v3-body-mind.css">',
            'Health trends CSS anchor'
          );
          html = replaceRequired(
            html,
            '  <script src="health-v3-history.js"></script>\n  <script src="health-v3-body-mind.js"></script>',
            '  <script src="health-v3-history.js"></script>\n  <script src="health-v3-trends.js"></script>\n  <script src="health-v3-body-mind.js"></script>',
            'Health trends JS anchor'
          );
          fs.writeFileSync('index.html', html);

          let worker = fs.readFileSync('service-worker.js', 'utf8');
          worker = replaceRequired(
            worker,
            "const CACHE_NAME = 'grizzlyjohn-v37-wisdom-secular';",
            "const CACHE_NAME = 'grizzlyjohn-v38-health-trends';",
            'service-worker cache name'
          );
          worker = replaceRequired(
            worker,
            "  './health-v3-history.css',\n  './health-v3-body-mind.css',",
            "  './health-v3-history.css',\n  './health-v3-trends.css',\n  './health-v3-body-mind.css',",
            'service-worker trend CSS anchor'
          );
          worker = replaceRequired(
            worker,
            "  './health-v3-history.js',\n  './health-v3-body-mind.js',",
            "  './health-v3-history.js',\n  './health-v3-trends.js',\n  './health-v3-body-mind.js',",
            'service-worker trend JS anchor'
          );
          fs.writeFileSync('service-worker.js', worker);

          let historyTest = fs.readFileSync('tests/health-v3-history.test.js', 'utf8');
          historyTest = replaceRequired(
            historyTest,
            'assert.match(worker, /grizzlyjohn-v37-wisdom-secular/);',
            'assert.match(worker, /grizzlyjohn-v38-health-trends/);',
            'Health history cache assertion'
          );
          fs.writeFileSync('tests/health-v3-history.test.js', historyTest);
          NODE
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/health-v3-history.test.js
          if git diff --cached --quiet; then
            echo "Wiring already applied."
          else
            git commit -m "Wire V3 Health trend charts"
            git push origin HEAD:v3/health-foundation
          fi
