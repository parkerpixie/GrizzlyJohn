name: Polish V3 Body and Mind Copy

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - scripts/polish-v3-body-mind-copy.mjs

permissions:
  contents: write

jobs:
  polish-body-mind-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
          fetch-depth: 0
      - name: Apply Body and Mind copy polish
        run: node scripts/polish-v3-body-mind-copy.mjs
      - name: Commit copy polish
        run: |
          if git diff --quiet -- health-v3-body-mind.js health-v3-body-mind.css service-worker.js tests; then
            echo "Body + Mind copy already polished."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-v3-body-mind.js health-v3-body-mind.css service-worker.js tests
          git commit -m "Polish Body and Mind wording"
          git push origin HEAD:v3/health-foundation
