name: Wire V3 Wisdom Shelf

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - .github/workflows/v3-wisdom-wire.yml

permissions:
  contents: write

jobs:
  wire-wisdom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
      - name: Wire Wisdom Shelf and Breath clock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) {
              if (source.includes(to)) return source;
              throw new Error(`Could not find ${label}; refusing to rewrite.`);
            }
            return source.replace(from, to);
          }

          let html = fs.readFileSync('index.html', 'utf8');
          html = replaceRequired(
            html,
            '  <link rel="stylesheet" href="health-v3-body-mind.css">',
            '  <link rel="stylesheet" href="health-v3-body-mind.css">\n  <link rel="stylesheet" href="wisdom-v3-shelf.css">\n  <link rel="stylesheet" href="breath-v3-clock.css">',
            'V3 Wisdom styles anchor'
          );
          html = replaceRequired(
            html,
            '  <script src="health-v3-body-mind.js"></script>',
            '  <script src="health-v3-body-mind.js"></script>\n  <script src="wisdom-v3-shelf.js"></script>\n  <script src="breath-v3-clock.js"></script>',
            'V3 Wisdom scripts anchor'
          );
          fs.writeFileSync('index.html', html);

          let worker = fs.readFileSync('service-worker.js', 'utf8');
          worker = replaceRequired(
            worker,
            "const CACHE_NAME = 'grizzlyjohn-v34-health-body-mind-copy';",
            "const CACHE_NAME = 'grizzlyjohn-v35-health-wisdom-shelf';",
            'service-worker cache name'
          );
          worker = replaceRequired(
            worker,
            "  './health-v3-body-mind.css',",
            "  './health-v3-body-mind.css',\n  './wisdom-v3-shelf.css',\n  './breath-v3-clock.css',",
            'service-worker CSS anchor'
          );
          worker = replaceRequired(
            worker,
            "  './health-v3-body-mind.js',",
            "  './health-v3-body-mind.js',\n  './wisdom-v3-shelf.js',\n  './breath-v3-clock.js',",
            'service-worker JS anchor'
          );
          fs.writeFileSync('service-worker.js', worker);

          let historyTest = fs.readFileSync('tests/health-v3-history.test.js', 'utf8');
          historyTest = replaceRequired(
            historyTest,
            'assert.match(worker, /grizzlyjohn-v34-health-body-mind-copy/);',
            'assert.match(worker, /grizzlyjohn-v35-health-wisdom-shelf/);',
            'Health history cache assertion'
          );
          fs.writeFileSync('tests/health-v3-history.test.js', historyTest);
          NODE
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js tests/health-v3-history.test.js
          if git diff --cached --quiet; then
            echo "Wiring already applied."
          else
            git commit -m "Wire V3 Wisdom Shelf and Breath clock"
            git push origin HEAD:v3/health-foundation
          fi
