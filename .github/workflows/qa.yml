name: GrizzlyJohn QA

on:
  push:
    branches:
      - GrizzlyJohnV2
      - 'qa/**'
  pull_request:
    branches:
      - GrizzlyJohnV2

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Chicago
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run GrizzlyJohn tests
        run: node --test tests/*.test.js
