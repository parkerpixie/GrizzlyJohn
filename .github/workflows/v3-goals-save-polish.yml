name: Polish V3 Health Goal Save

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - scripts/polish-v3-goals-save.mjs

permissions:
  contents: write

jobs:
  polish-goal-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
          fetch-depth: 0
      - name: Polish Health goal save experience
        run: node scripts/polish-v3-goals-save.mjs
      - name: Commit goal save polish
        run: |
          if git diff --quiet -- health-v3-history.js health-v3-history.css service-worker.js tests/health-v3-history.test.js tests/health-v3-dashboard.test.js tests/health-v3-ui.test.js; then
            echo "Health goal save polish is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-v3-history.js health-v3-history.css service-worker.js tests/health-v3-history.test.js tests/health-v3-dashboard.test.js tests/health-v3-ui.test.js
          git commit -m "Polish Health goal save experience"
          git push origin HEAD:v3/health-foundation
