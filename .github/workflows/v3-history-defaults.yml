name: Tune V3 Health Defaults

on:
  push:
    branches:
      - v3/health-foundation
    paths:
      - scripts/tune-v3-history-defaults.mjs

permissions:
  contents: write

jobs:
  tune-health-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4
        with:
          ref: v3/health-foundation
          fetch-depth: 0
      - name: Let John choose his own daily Health Check-In
        run: node scripts/tune-v3-history-defaults.mjs
      - name: Commit tuned default
        run: |
          if git diff --quiet -- health-v3-history.js; then
            echo "Health check-in default already tuned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add health-v3-history.js
          git commit -m "Let John choose his Health check-in items"
          git push origin HEAD:v3/health-foundation
