<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>GrizzlyJohn Backpack Suggestion</title>
</head>
<body>
  <!-- Static copy lets Netlify detect the form at deploy time. The visible form lives inside the Roam backpack UI. -->
  <form name="john-backpack-idea" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/backpack-suggestion.html" hidden>
    <input type="hidden" name="form-name" value="john-backpack-idea">
    <p hidden><label>Do not fill this out: <input name="bot-field"></label></p>
    <input name="from" value="John">
    <input name="collectionIdea">
    <textarea name="details"></textarea>
    <input name="submittedFrom" value="GrizzlyJohn Roaming Backpack">
  </form>
  <p>Thanks, John. Your backpack idea was sent.</p>
</body>
</html>
